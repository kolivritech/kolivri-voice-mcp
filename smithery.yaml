# Smithery MCP Server Manifest: https://smithery.ai/docs/config#smitheryyaml
name: kolivri-voice-mcp
description: Kolivri AI Voice MCP Server — give Claude Code, OpenCode, Cursor, and Claude Desktop a real phone line with KYC and rate-limit guards.
tools:
  - name: kolivri_place_call
    description: Place an outbound AI voice call via Kolivri Engine with KYC verified-caller and anti-abuse rate-limit protection.
  - name: kolivri_get_call_status
    description: Retrieve structured call status, outcome, transcript, summary, appointment status, and recording URL for a Kolivri call.
  - name: kolivri_carrier_forwarding_codes
    description: Generate 30-second GSM/carrier call-forwarding dial codes (*61*, *67*, *62*, *21* and ##002# reset) for Israeli telecom carriers.
  - name: kolivri_preview_roi
    description: Calculate SMB missed-call revenue loss and recommend the matching Kolivri unified plan (Starter $69 / ₪247, Business $139 / ₪479, Pro $249 / ₪880).
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - kolivriApiKey
    properties:
      kolivriApiKey:
        type: string
        description: Kolivri API key sent in the x-api-key header for authenticated voice calls.
      kolivriWebhookId:
        type: string
        default: default-webhook
        description: Default Kolivri campaign/engine webhook ID.
      kolivriVerifiedCallerId:
        type: string
        description: Comma-separated KYC-verified outbound caller IDs in E.164 or Israeli format.
      kolivriApiUrl:
        type: string
        default: https://app.kolivri.co.il
        description: Kolivri API base URL.
  commandFunction: |-
    // Spawns: node src/server.mjs
    (config) => ({
      command: 'node',
      args: ['src/server.mjs'],
      env: {
        KOLIVRI_API_KEY: config.kolivriApiKey,
        ...(config.kolivriWebhookId ? { KOLIVRI_WEBHOOK_ID: config.kolivriWebhookId } : {}),
        ...(config.kolivriVerifiedCallerId ? { KOLIVRI_VERIFIED_CALLER_ID: config.kolivriVerifiedCallerId } : {}),
        KOLIVRI_API_URL: config.kolivriApiUrl || 'https://app.kolivri.co.il'
      }
    })
